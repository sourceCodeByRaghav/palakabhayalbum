[build]
  command = "npm run netlify-build"
  publish = "build"
  functions = "functions"

[build.environment]
  NODE_VERSION = "18.20.1"  # Verified React-compatible version
  NPM_VERSION = "10.5.0"
  CI = "false"
  # Enable Node.js module caching
  NPM_FLAGS = "--legacy-peer-deps --prefer-offline"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
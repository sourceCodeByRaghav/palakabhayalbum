[build]
  command = "npm cache clean --force && npm install && npm run build"
  publish = "dist"  # Change this if your build output folder is different

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

[functions]
  node_bundler = "esbuild"

[dev]
  framework = "#custom"
  command = "npm start"
  port = 8888
  targetPort = 3000

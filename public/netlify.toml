[build]
  command = "npm run netlify-build"
  publish = "build"
  functions = "functions"

[build.environment]
  NODE_VERSION = "18.20.1"  # Node 18 LTS recommended
  NPM_VERSION = "10.5.0"
  CI = "false"
  NPM_FLAGS = "--legacy-peer-deps --registry=https://registry.npmjs.org"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[build]
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "build"
  functions = "functions"

[build.environment]
  NODE_VERSION = "18.20.1"
  NPM_VERSION = "10.5.0"
  GO_VERSION = "none"
  CI = "false"
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "npm install --legacy-peer-deps && npm run build"
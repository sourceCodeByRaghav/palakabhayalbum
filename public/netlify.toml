[build]
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "build"
  functions = "functions"

[build.environment]
  NODE_VERSION = "18.20.1"  # Recommended for React
  NPM_VERSION = "10.5.0"
  GO_VERSION = "none"       # Explicitly disable Go
  CI = "false"              # Prevents warnings from failing builds

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[build]
  command = "npm run build"
  publish = "build"
  functions = "functions"

[build.environment]
  NODE_VERSION = "18.20.1"  # LTS version with better React compatibility
  NPM_VERSION = "10.5.0"
  CI = "false"  # Prevent build failures on warnings

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
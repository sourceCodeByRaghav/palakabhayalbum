[build]
  command = "npm cache clean --force && npm install && npm run build"
  publish = "build"  # Changed to "build" since React creates a build folder, not dist

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"
  GO_VERSION = "1.20"

[functions]
  node_bundler = "esbuild"

[dev]
  framework = "create-react-app"  # Changed to specify the React framework
  command = "npm start"
  port = 8888
  targetPort = 3000